# 의존성 보안 업데이트 자동 PR (매주)
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      expo-sdk:
        patterns: ['expo', 'expo-*', '@expo/*', 'react', 'react-native', 'react-dom', 'react-native-*']
        update-types: ['patch']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
