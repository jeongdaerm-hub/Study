# 스토어(네이티브) 빌드: 네이티브 변경 시 사용. 빌드는 EAS 클라우드에서 진행
# 필요 시크릿: EXPO_TOKEN
name: Store Build

on:
  workflow_dispatch:
    inputs:
      app:
        description: 'apps/ 아래 폴더명 (예: pet)'
        required: true
      platform:
        type: choice
        options: [all, android, ios]
        default: all
      profile:
        type: choice
        options: [production, preview, development]
        default: production
      submit:
        description: '빌드 후 스토어 제출 (production 만)'
        type: boolean
        default: false

# 앱 설정에 들어가는 공개 값은 GitHub Variables 에서 읽음 (비밀값 아님)
env:
  DARO_SCAN_API_URL: ${{ vars.DARO_SCAN_API_URL }}
  EAS_PROJECT_ID_PET: ${{ vars.EAS_PROJECT_ID_PET }}
  # 나(관리자) 영역 잠금 해시 (없으면 실제 앱의 관리자 기능 꺼짐). npm run admin:hash 로 생성
  DARO_ADMIN_CODE_HASH: ${{ secrets.DARO_ADMIN_CODE_HASH }}
  # 가족 공유 서버 (공개 주소·공개 키. 관리자 키는 절대 넣지 않음)
  DARO_SUPABASE_URL: ${{ vars.DARO_SUPABASE_URL }}
  DARO_SUPABASE_ANON_KEY: ${{ vars.DARO_SUPABASE_ANON_KEY }}

jobs:
  build:
    runs-on: ubuntu-latest
    # production 빌드·제출은 승인 후에만 (preview 는 바로)
    environment: ${{ inputs.profile == 'production' && 'production' || 'preview' }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate app
        run: test -d "apps/${{ inputs.app }}" || { echo "apps/${{ inputs.app }} 없음"; exit 1; }
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Build
        working-directory: apps/${{ inputs.app }}
        run: |
          SUBMIT=""
          if [ "${{ inputs.submit }}" = "true" ] && [ "${{ inputs.profile }}" = "production" ]; then SUBMIT="--auto-submit"; fi
          eas build --platform "${{ inputs.platform }}" --profile "${{ inputs.profile }}" --non-interactive --no-wait $SUBMIT
