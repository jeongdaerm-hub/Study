# 보안 점검: PR·main 푸시·매주 월요일 자동 실행
#  - 의존성 취약점 (npm audit, moderate 이상이면 실패)
#  - 비밀키·위험 코드 패턴 (자체 스캐너)
#  - 비밀키 유출 이력 (gitleaks, 전체 git 이력)
#  - 정적 분석 SAST (CodeQL: XSS, 인젝션, 경로 조작 등)
name: Security

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 1 * * 1' # 매주 월 10:17 KST
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: npm audit (moderate 이상 차단)
        run: npm audit --audit-level=moderate
      - name: 자체 보안 스캔
        run: node scripts/security-scan.mjs

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # 전체 git 이력 검사 (PR 범위 계산에 의존하지 않음, 첫 커밋 포함)
      - name: gitleaks (전체 이력)
        run: |
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --exit-code 1 -v

  codeql:
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v3
        with:
          output: codeql-results
      # 발견 항목을 로그에 요약 (규칙 · 파일:줄 · 메시지)
      - name: CodeQL 결과 요약
        if: always()
        run: |
          for f in codeql-results/*.sarif; do
            jq -r '.runs[].results[] | "\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)\t\(.message.text | gsub("\n"; " ") | .[0:200])"' "$f"
          done
